standard = "2.1"
project = "codex-platform"
space = "BlueSkyXN/Codex-Platform-HFS"
sovereignty = "sovereign"
lane = "source"
version_source = "commit"
project_class = "preview"
target_role = "primary"
space_visibility = "protected"
bucket_visibility = "private"
env_file = ".env"
secret_files = []

# .env is the HFS value ledger. These control credentials are never Space settings.
local_only = ["HF_TOKEN", "GH_TOKEN"]

# Values stay in .env; this manifest registers only HFS Secret names.
secrets = [
  "CODEX_PLATFORM_AUTH_TOKEN",
  "CODEX_PLATFORM_OPS_TOKEN",
]

optional_secrets = [
  "CODEX_PLATFORM_ADMIN_CSRF_KEY",
  "CODEX_PLATFORM_ADMIN_TOKEN",
  "CODEX_PLATFORM_PUBLIC_API_KEYS",
  "CODEX_AUTH_TOKEN",
  "GITHUB_TOKEN",
  "OPENAI_API_KEY",
]

# Values stay in .env; this manifest registers only HFS Variable names.
variables = [
  "CODEX_ARGS",
  "CODEX_BIN",
  "CODEX_HOME",
  "CODEX_PLATFORM_ADMIN_ENABLED",
  "CODEX_PLATFORM_DATA_DIR",
  "CODEX_PLATFORM_HF_SPACE",
  "CODEX_PLATFORM_HF_STORAGE_ROOT",
  "CODEX_PLATFORM_PUBLIC_API_ALLOWED_ORIGINS",
  "CODEX_PLATFORM_PUBLIC_API_ENABLED",
  "DEMO_MODE",
  "HOST",
  "PORT",
  "WORKSPACE_ROOT",
  "WORKSPACE_ROOTS",
]
