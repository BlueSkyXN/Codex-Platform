name: Deploy Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit deployment profile
        required: true
        type: choice
        options:
          - candidate
          - production
      expected_source_sha:
        description: Full reviewed Git commit SHA to deploy and verify
        required: true
        type: string
      confirm_upload:
        description: Type PUBLISH_WRAPPER to authorize the Space write
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hf-space-codex-platform
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_upload == 'PUBLISH_WRAPPER'
    runs-on: ubuntu-latest
    env:
      FORMAL_SPACE: BlueSkyXN/Codex-Platform-HFS
      HFS_MANIFEST: ${{ inputs.target == 'candidate' && 'cloud/hfs/hfs-dev.candidate.toml' || 'cloud/hfs/hfs-dev.toml' }}
      HFS_TARGET: ${{ inputs.target }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact reviewed source
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_SHA}"
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Load target from selected manifest
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path(os.environ["HFS_MANIFEST"]).read_text(encoding="utf-8"))
          space_id = manifest.get("space", "")
          if not isinstance(space_id, str) or space_id.count("/") != 1:
              raise SystemExit(f"invalid Space id in {os.environ['HFS_MANIFEST']}: {space_id!r}")
          if os.environ["HFS_TARGET"] == "production" and space_id != os.environ["FORMAL_SPACE"]:
              raise SystemExit("production manifest must select the canonical Codex-Platform Space")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"HF_SPACE_ID={space_id}\n")
          PY

      - name: Export pinned Space bundle
        run: |
          CODEX_PLATFORM_COMMIT="${EXPECTED_SOURCE_SHA}" \
            bash cloud/hfs/export_space_bundle.sh /tmp/codex-platform-hfs-space

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.5.0" "click==8.3.3"

      - name: Validate HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing GitHub Secret HF_TOKEN; add a Hugging Face write token before using this workflow."
            exit 1
          fi

      - name: Upload Space bundle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$HFS_TARGET" == "production" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$EXPECTED_SOURCE_SHA" == "$GITHUB_SHA" ]]
            [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          fi
          python - <<'PY'
          # HFS_DEPLOY_PYTHON_BEGIN
          import hashlib
          import os
          import re
          from pathlib import Path

          from huggingface_hub import HfApi, create_repo, hf_hub_download, upload_folder
          from huggingface_hub.utils import RepositoryNotFoundError


          def deploy_space(
              *,
              api,
              create_repo_fn,
              upload_folder_fn,
              download_fn,
              repo_id: str,
              target: str,
              folder: Path,
              commit: str,
              token: str,
          ) -> str:
              if target not in {"candidate", "production"}:
                  raise SystemExit(f"unsupported HFS target: {target!r}")

              expected = {path.name for path in folder.iterdir() if path.is_file()}
              try:
                  info = api.repo_info(repo_id=repo_id, repo_type="space")
              except RepositoryNotFoundError:
                  if target == "production":
                      raise SystemExit("production Space must already exist; workflow creation is forbidden")
                  create_repo_fn(
                      repo_id=repo_id,
                      repo_type="space",
                      space_sdk="docker",
                      private=True,
                      exist_ok=False,
                      token=token,
                  )
                  info = api.repo_info(repo_id=repo_id, repo_type="space")

              if info.private is not True:
                  raise SystemExit("target Space must be private before wrapper upload")

              remote_before = set(api.list_repo_files(repo_id=repo_id, repo_type="space"))
              unexpected_before = remote_before - expected - {".gitattributes"}
              if unexpected_before:
                  raise SystemExit(
                      "refusing to write a non-thin Space; separate cleanup approval is required: "
                      + ", ".join(sorted(unexpected_before))
                  )

              upload_folder_fn(
                  repo_id=repo_id,
                  repo_type="space",
                  folder_path=str(folder),
                  path_in_repo=".",
                  token=token,
                  commit_message=f"deploy: Codex-Platform {commit[:12]}",
              )

              remote = set(api.list_repo_files(repo_id=repo_id, repo_type="space"))
              unexpected = remote - expected - {".gitattributes"}
              missing = expected - remote
              if unexpected or missing:
                  raise SystemExit(
                      f"Space tree mismatch; missing={sorted(missing)}, unexpected={sorted(unexpected)}"
                  )

              for name in sorted(expected):
                  downloaded = Path(download_fn(
                      repo_id=repo_id,
                      repo_type="space",
                      filename=name,
                      token=token,
                  ))
                  local_digest = hashlib.sha256((folder / name).read_bytes()).hexdigest()
                  remote_digest = hashlib.sha256(downloaded.read_bytes()).hexdigest()
                  if local_digest != remote_digest:
                      raise SystemExit(f"Space readback mismatch for {name}")

              info = api.space_info(repo_id=repo_id, expand=["subdomain"], token=token)
              subdomain = info.subdomain
              if not isinstance(subdomain, str) or not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,126}", subdomain):
                  raise SystemExit("Space metadata is missing a safe hashed subdomain")

              api.restart_space(repo_id=repo_id, factory_reboot=True)
              return subdomain


          def main() -> None:
              token = os.environ["HF_TOKEN"]
              repo_id = os.environ["HF_SPACE_ID"]
              subdomain = deploy_space(
                  api=HfApi(token=token),
                  create_repo_fn=create_repo,
                  upload_folder_fn=upload_folder,
                  download_fn=hf_hub_download,
                  repo_id=repo_id,
                  target=os.environ["HFS_TARGET"],
                  folder=Path("/tmp/codex-platform-hfs-space"),
                  commit=os.environ["GITHUB_SHA"],
                  token=token,
              )
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
                  env_file.write(f"HF_PUBLIC_URL=https://{subdomain}.hf.space\n")


          if __name__ == "__main__":
              main()
          # HFS_DEPLOY_PYTHON_END
          PY

      - name: Live smoke
        env:
          HF_GATEWAY_TOKEN: ${{ secrets.HF_TOKEN }}
          CODEX_PLATFORM_AUTH_TOKEN: ${{ secrets.CODEX_PLATFORM_AUTH_TOKEN }}
          SMOKE_RETRIES: "45"
          SMOKE_DELAY: "20"
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          scripts/hf-space-smoke.sh "$HF_PUBLIC_URL"
